<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laser Closure Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=10">
    <link rel="stylesheet" href="target-list.css?v=3">
    <link rel="stylesheet" href="../tools/tool-theme.css?v=1">
    <link rel="stylesheet" href="glass.css?v=3">
    <script type="module" src="../stars.js?v=3"></script>
    <!-- three.js 0.187.0, distributed with its MIT license in vendor/. -->
    <script type="module" src="keck-scene.js?v=4"></script>
  </head>
  <body data-laser="idle">
    <canvas id="warp-canvas" aria-hidden="true"></canvas>
    <main class="shell">
      <header class="masthead">
        <a href="../tools/" class="home-link" aria-label="Back to tools"><img src="../icons/arrow_back_30dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt=""></a>
        <h1>Laser closures</h1>
        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="true">Light mode</button>
      </header>

      <section class="scene" aria-label="Keck Observatory 3D view">
        <keck-scene laser="off"></keck-scene>
        <div class="scene-caption">
          <p class="laser-state"><span class="lamp" aria-hidden="true"></span>Keck II <span id="laserState" aria-live="polite">No schedule loaded</span></p>
          <p class="pointing" id="pointing">Parked</p>
        </div>
      </section>

      <section class="readout" aria-label="Closure summary">
        <div class="readout-main">
          <span class="label" id="nextCountdownLabel">Next closure in</span>
          <strong class="countdown" id="nextCountdown">--</strong>
          <p class="duration">Lasts <span id="durationValue">--</span></p>
          <p id="nextDetail"></p>
        </div>
        <div class="readout-stack">
          <span class="label" id="startLabel">Starts</span>
          <strong id="nextValue">--</strong>
          <p id="nextStartDetail">--</p>
        </div>
      </section>

      <section class="controls" aria-label="Schedule controls">
        <div class="upload" id="dropZone">
          <input id="fileInput" type="file" accept=".txt,text/plain">
          <button class="primary" id="chooseFile" type="button">Load file</button>
          <div>
            <strong id="fileName">Drop a schedule file here</strong>
            <span id="fileMeta">or click to choose a .txt file</span>
          </div>
        </div>

        <label>
          <span>UT date</span>
          <input id="scheduleDate" type="date">
        </label>

        <label>
          <span>Time zone</span>
          <select id="zoneSelect">
            <option>Detecting browser time zone...</option>
          </select>
        </label>
      </section>

      <section class="timeline-section" aria-label="Closure timeline">
        <div class="section-head">
          <div class="target-picker">
            <h2><button class="target-button" id="targetButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="targetPopup" disabled>
              <span id="targetName">No target selected</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button></h2>
            <select id="targetSelect" hidden disabled>
              <option value="">No targets loaded</option>
            </select>
            <div class="target-popup" id="targetPopup" hidden>
              <div class="target-list" id="targetList" role="listbox" tabindex="-1" aria-label="Targets"></div>
            </div>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
        <p class="legend"><span class="key open"></span>Open <span class="key closure"></span>Closure <span class="key next"></span>Next closure</p>
      </section>

      <section class="table-section" aria-label="Closure table">
        <div class="section-head">
          <h2>All closures</h2>
          <p id="tableMeta">--</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Start</th>
                <th scope="col">End</th>
                <th scope="col">Duration</th>
                <th scope="col">UTC start</th>
                <th scope="col">UTC end</th>
                <th scope="col">LST start</th>
                <th scope="col">LST end</th>
              </tr>
            </thead>
            <tbody id="closureRows">
              <tr>
                <td colspan="8">Load a file to see closures.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="pointing.js?v=3"></script>
    <script src="app.js?v=11"></script>
    <script src="target-list.js?v=2"></script>
  </body>
</html>

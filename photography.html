<!--
  FIX URLS AND PHOTO NAMES
  PHOTO NAMES NEED TO BE A SPECIFIC FORMAT
  YYYY-MM-DD-NAME.jpg
-->
<div class="photorow">
{% for post in site.categories.Photos %}

  {% assign newrow = forloop.index0 | modulo: 2 %}
  {% if  newrow == 0 and forloop.index0 != 0 %}
    </div> 
    <div class="photorow">
  {% endif %}

  <div class="photocolumn">
    <a href={{ post.url }}>
      <img src="{{ post.photo }}" />
    </a>
  </div>

{% endfor %}
</div>

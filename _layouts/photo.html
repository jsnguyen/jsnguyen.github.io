---
layout: default
---

<post>
  <div style="display: flex; justify-content: center;">
    <h3> {{ page.date | date_to_string | downcase }} </h3>
  </div>

  <div style="display: flex; justify-content: center;">
    {% assign stripped_name = page.path | remove: "_posts/" | remove: ".md" %}
    <img src="/assets/photos/{{ stripped_name }}.jpg" alt="{{ stripped_name }}" style="width: 75%">
  </div>

  <div style="display: flex; justify-content: center;">
    {{ content }}
  </div>
</post>

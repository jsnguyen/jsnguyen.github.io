<div id="starfield-grid-options" aria-label="Starfield background concepts">
  <style>
    #starfield-grid-options { font-family: system-ui, sans-serif; --caption: light-dark(#263344, #e9eef5); --caption-muted: light-dark(#586574, #aeb9c7); }
    #starfield-grid-options .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
    #starfield-grid-options figure { min-width: 0; margin: 0; }
    #starfield-grid-options figcaption { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 10px; margin-bottom: 8px; color: var(--caption); font-size: 14px; font-weight: 500; }
    #starfield-grid-options figcaption span { color: var(--caption-muted); font-size: 12px; font-weight: 400; }
    #starfield-grid-options .scene { position: relative; overflow: hidden; border-radius: 10px; background: #19172e; }
    #starfield-grid-options canvas { display: block; width: 100%; aspect-ratio: 16 / 10; }
    #starfield-grid-options .page-card { position: absolute; left: 19%; top: 29%; width: 62%; padding: 13px 10px; box-sizing: border-box; border: 1px solid #777786; border-radius: 12px; background: #383844; color: #f4f4f7; text-align: center; box-shadow: 0 5px 18px #00000024; }
    #starfield-grid-options .page-name { font-size: 14px; font-weight: 500; line-height: 1.3; }
    #starfield-grid-options .page-subtitle { margin-top: 7px; font-size: 11px; line-height: 1.4; color: #ddddE5; }
    #starfield-grid-options.hide-content .page-card { visibility: hidden; }
    @media (max-width: 560px) { #starfield-grid-options .concepts { grid-template-columns: minmax(0, 1fr); } }
  </style>
  <div class="concepts">
    <figure>
      <figcaption>Current tunnel <span>Geometric · enclosed</span></figcaption>
      <div class="scene"><canvas data-style="current" role="img" aria-label="Current rectangular tunnel with radial spokes and nested frames behind the starfield."></canvas><div class="page-card"><div class="page-name">Jayke Samson Nguyen</div><div class="page-subtitle">Astrophysics · UC San Diego</div></div></div>
    </figure>
    <figure>
      <figcaption>Orbital arcs <span>Astronomical · open</span></figcaption>
      <div class="scene"><canvas data-style="orbits" role="img" aria-label="A few fine, sweeping orbital arcs around the edges leave the center open."></canvas><div class="page-card"><div class="page-name">Jayke Samson Nguyen</div><div class="page-subtitle">Astrophysics · UC San Diego</div></div></div>
    </figure>
    <figure>
      <figcaption>Hexagonal tunnel <span>Tron · structured</span></figcaption>
      <div class="scene"><canvas data-style="hex" role="img" aria-label="Sparse nested hexagonal frames and six rails converge into the distance, echoing the six-point stars."></canvas><div class="page-card"><div class="page-name">Jayke Samson Nguyen</div><div class="page-subtitle">Astrophysics · UC San Diego</div></div></div>
    </figure>
    <figure>
      <figcaption>Celestial chart <span>Observatory · technical</span></figcaption>
      <div class="scene"><canvas data-style="chart" role="img" aria-label="A stylized celestial coordinate net with curved meridians, declination lines and small registration marks."></canvas><div class="page-card"><div class="page-name">Jayke Samson Nguyen</div><div class="page-subtitle">Astrophysics · UC San Diego</div></div></div>
    </figure>
    <figure>
      <figcaption>Horizon grid <span>Retro · spacious</span></figcaption>
      <div class="scene"><canvas data-style="floor" role="img" aria-label="A perspective grid is confined to the lower portion of the scene, opening up the sky above."></canvas><div class="page-card"><div class="page-name">Jayke Samson Nguyen</div><div class="page-subtitle">Astrophysics · UC San Diego</div></div></div>
    </figure>
    <figure>
      <figcaption>Stars only <span>Minimal · immersive</span></figcaption>
      <div class="scene"><canvas data-style="none" role="img" aria-label="The colored trails and subtle distant stars stand alone against a dark background with no grid."></canvas><div class="page-card"><div class="page-name">Jayke Samson Nguyen</div><div class="page-subtitle">Astrophysics · UC San Diego</div></div></div>
    </figure>
  </div>
  <script>
    (() => {
      const root = document.getElementById("starfield-grid-options");
      const state = { showContent: true, structureOpacity: 0.22 };
      const canvases = [...root.querySelectorAll("canvas")];
      const palette = [[65, 205, 255], [245, 250, 255], [255, 220, 70], [255, 164, 64], [255, 55, 35]];
      let seed = 73421;
      const random = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
      const points = Array.from({ length: 76 }, () => ({ x: random(), y: random(), size: 0.3 + random() ** 3 }));
      const trails = Array.from({ length: 44 }, () => ({ angle: random() * Math.PI * 2, radius: 0.12 + random() * 0.66, size: 0.4 + random(), length: 0.035 + random() * 0.075 }));

      function waveColor(angle, depth) {
        const position = (1 + Math.cos(angle - 0.7 - depth * 0.35)) * 2;
        const index = Math.floor(position);
        const next = Math.min(index + 1, palette.length - 1);
        return palette[index].map((channel, i) => Math.round(channel + (palette[next][i] - channel) * (position - index))).join(",");
      }

      function line(ctx, x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function drawStructure(ctx, style, width, height) {
        const cx = width / 2;
        const cy = height / 2;
        ctx.strokeStyle = `rgba(208,218,235,${state.structureOpacity})`;
        ctx.lineWidth = 0.65;
        if (style === "current") {
          for (let i = 0; i < 32; i++) {
            const angle = i * Math.PI / 16;
            line(ctx, cx, cy, cx + Math.cos(angle) * width, cy + Math.sin(angle) * width);
          }
          for (let i = 0; i < 8; i++) {
            const scale = 0.95 * 0.875 ** i;
            ctx.strokeRect(cx - width * scale / 2, cy - height * scale / 2, width * scale, height * scale);
          }
        } else if (style === "orbits") {
          for (let i = 0; i < 3; i++) {
            const rx = width * (0.39 + i * 0.17);
            const ry = height * (0.29 + i * 0.17);
            const tilt = -0.33;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, tilt, 0.2 + i * 0.25, Math.PI * 1.75 + i * 0.1);
            ctx.stroke();
            const a = 0.85 + i * 1.4;
            const x = cx + Math.cos(a) * rx * Math.cos(tilt) - Math.sin(a) * ry * Math.sin(tilt);
            const y = cy + Math.cos(a) * rx * Math.sin(tilt) + Math.sin(a) * ry * Math.cos(tilt);
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (style === "hex") {
          const vertices = Array.from({ length: 6 }, (_, i) => ({ x: Math.cos(Math.PI / 6 + i * Math.PI / 3) * width * 0.64, y: Math.sin(Math.PI / 6 + i * Math.PI / 3) * height * 0.65 }));
          for (const point of vertices) line(ctx, cx, cy, cx + point.x * 2, cy + point.y * 2);
          for (let ring = 0; ring < 5; ring++) {
            const scale = 0.78 ** ring;
            ctx.beginPath();
            vertices.forEach((point, i) => {
              if (i === 0) ctx.moveTo(cx + point.x * scale, cy + point.y * scale);
              else ctx.lineTo(cx + point.x * scale, cy + point.y * scale);
            });
            ctx.closePath();
            ctx.stroke();
          }
        } else if (style === "chart") {
          for (let i = -2; i <= 2; i++) {
            const x = cx + i * width * 0.19;
            ctx.beginPath();
            ctx.moveTo(x + i * width * 0.1, 0);
            ctx.bezierCurveTo(x - i * width * 0.05, height * 0.27, x - i * width * 0.05, height * 0.73, x + i * width * 0.1, height);
            ctx.stroke();
            const y = cy + i * height * 0.2;
            ctx.beginPath();
            ctx.moveTo(0, y - height * 0.05);
            ctx.quadraticCurveTo(cx, y + height * 0.15, width, y - height * 0.05);
            ctx.stroke();
          }
          [[0.12, 0.28], [0.84, 0.17], [0.23, 0.79], [0.8, 0.75]].forEach(([x, y]) => {
            line(ctx, x * width - 3, y * height, x * width + 3, y * height);
            line(ctx, x * width, y * height - 3, x * width, y * height + 3);
          });
        } else if (style === "floor") {
          const horizon = height * 0.53;
          for (let i = -7; i <= 7; i++) line(ctx, cx, horizon, cx + i * width * 0.16, height);
          for (let i = 0; i <= 9; i++) {
            const y = horizon + (height - horizon) * (i / 9) ** 2;
            line(ctx, 0, y, width, y);
          }
        }
      }

      function renderCanvas(canvas) {
        const { width, height } = canvas.getBoundingClientRect();
        if (!width || !height) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#19172e";
        ctx.fillRect(0, 0, width, height);
        drawStructure(ctx, canvas.dataset.style, width, height);

        const cx = width / 2;
        const cy = height / 2;
        for (const point of points) {
          const x = point.x * width;
          const y = point.y * height;
          const color = waveColor(Math.atan2(y - cy, x - cx), Math.hypot(x - cx, y - cy) / width);
          ctx.strokeStyle = `rgba(${color},${0.13 + point.size * 0.11})`;
          ctx.lineWidth = 0.4;
          for (let i = 0; i < 3; i++) {
            const angle = Math.PI / 6 + i * Math.PI / 3;
            const dx = Math.cos(angle) * point.size * 2.8;
            const dy = Math.sin(angle) * point.size * 2.8;
            line(ctx, x - dx, y - dy, x + dx, y + dy);
          }
        }
        ctx.lineCap = "round";
        for (const trail of trails) {
          const distance = trail.radius * width;
          const x = cx + Math.cos(trail.angle) * distance;
          const y = cy + Math.sin(trail.angle) * distance;
          const sx = x - Math.cos(trail.angle) * trail.length * width;
          const sy = y - Math.sin(trail.angle) * trail.length * width;
          const color = waveColor(trail.angle, trail.radius);
          const fade = ctx.createLinearGradient(sx, sy, x, y);
          fade.addColorStop(0, `rgba(${color},0)`);
          fade.addColorStop(1, `rgba(${color},0.65)`);
          ctx.strokeStyle = fade;
          ctx.lineWidth = trail.size * 2.6;
          ctx.globalAlpha = 0.16;
          line(ctx, sx, sy, x, y);
          ctx.lineWidth = trail.size * 0.65;
          ctx.globalAlpha = 1;
          line(ctx, sx, sy, x, y);
        }
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(width, height);
        const mask = ctx.createRadialGradient(0, 0, 0.13, 0, 0, 0.63);
        mask.addColorStop(0, "rgba(0,0,0,0.8)");
        mask.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = mask;
        ctx.fillRect(-0.5, -0.5, 1, 1);
        ctx.restore();
      }

      function render() {
        root.classList.toggle("hide-content", !state.showContent);
        canvases.forEach(renderCanvas);
      }
      render();
      new ResizeObserver(render).observe(root);
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addToggle(state, "showContent", { label: "Show page content" });
        tweak.addSlider(state, "structureOpacity", { label: "Structure opacity", min: 0.08, max: 0.35, step: 0.01 });
      }
    })();
  </script>
</div>

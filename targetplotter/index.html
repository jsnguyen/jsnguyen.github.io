<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">

    <title>Target Plotter</title>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <link rel="stylesheet" href="../styles.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">


    <link rel="stylesheet" href="https://pyscript.net/releases/2025.11.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.11.1/core.js"></script>

    <script type="module" src="../stars.js"></script>

    <script src="sesame.js"></script>
    <script src="targetplotter.js"></script>

</head>
<body>

    <canvas id="warp-canvas"></canvas>

    <header>
        <h2><a href="../index.html">jayke.io</a></h2>
    </header>

    <main>

        <div class="pyscript-card glass-card">
            <div class="pyscript-card-header">
                <h2>Target Plotter</h2>
                <p> Note: the visibility is according to the limits on the Keck II telescope. </p>
            </div>
            <div class="display-container loading">
                <div id="loading-placeholder">
                    <div class="loading-spinner-light"></div>
                    <p>Loading target plotter...</p>
                </div>
                <div id="plot-loading">
                    <div class="loading-spinner-dark"></div>
                    <p>Generating plot...</p>
                </div>
                <div id="ready">
                    <p>Ready to plot!</p>
                </div>
                <script type="py" src="targetplotter.py" config="pyscript.toml"></script>
            </div>
            
            <div class="plot-bottom-bar">
                <button id="plot_button" disabled>Make Plot</button>
                <button id="save_button" disabled>Save Plot</button>
            </div>

            <div class="input-container">

                <div class="input-section">
                    <div class="input-section-header">Target</div>
                    
                    <div class="input-group">
                        <label class="input-label" for="target_name_input">Target Name</label>
                        <input type="text" id="target_name_input" placeholder="Target Name" value="HR 8799" />
                        <button type="button" id="resolve_button" onclick="resolveTarget()">Resolve</button>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="ra_input">RA (HMS)</label>
                        <input type="text" id="ra_input" placeholder="RA" value="23 07 28.7" />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="dec_input">Dec (DMS)</label>
                        <input type="text" id="dec_input" placeholder="Dec" value="+21 08 03.0"/>
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-section-header">Observation Date</div>
                    
                    <div class="input-group">
                        <label class="input-label" for="date_input">Date (UTC)</label>
                        <input type="date" id="date_input" value="2025-01-01" />
                    </div>
                </div>

                <div class="input-section">
                    <div class="input-section-header">Observing Location</div>
                    
                    <div class="input-group">
                        <label class="input-label" for="lat_input">Latitude</label>
                        <input type="text" id="lat_input" placeholder="19.8286" value="19.8286" />
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="lon_input">Longitude</label>
                        <input type="text" id="lon_input" placeholder="-155.4742" value="-155.4742"/>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer>
        2025 jayke.io
    </footer>

</body>
</html>

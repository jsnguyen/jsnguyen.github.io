<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Plotter</title>

    <!-- Google Fonts' Stack Sans variable subsets, licensed under fonts/OFL.txt. -->
    <link rel="stylesheet" href="vendor/uPlot.min.css">
    <link rel="stylesheet" href="plot.css?v=9">
    <link rel="stylesheet" href="empty-plot.css?v=1">
    <link rel="stylesheet" href="timezone-mode.css?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#ffffff">

    <!-- uPlot and Astronomy Engine are distributed with their MIT licenses. -->
    <script type="importmap">
        {"imports": {"./observing.js": "./observing.js?v=4", "./plot.js": "./plot.js?v=6", "./time.js": "./time.js?v=3", "./axis.js": "./axis.js?v=2", "./summary.js": "./summary.js?v=5", "./interval.js": "./interval.js?v=2", "./empty-plot.js": "./empty-plot.js?v=1", "./remaining-time.js": "./remaining-time.js?v=1"}}
    </script>
    <link rel="modulepreload" href="plot.js?v=6">
    <link rel="modulepreload" href="observing.js?v=4">
    <link rel="modulepreload" href="history.js">
    <link rel="modulepreload" href="time.js?v=3">
    <link rel="modulepreload" href="axis.js?v=2">
    <link rel="modulepreload" href="summary.js?v=5">
    <link rel="modulepreload" href="current-time.js">
    <link rel="modulepreload" href="interval.js?v=2">
    <link rel="modulepreload" href="empty-plot.js?v=1">
    <link rel="modulepreload" href="remaining-time.js?v=1">
    <script defer src="vendor/astronomy.browser.min.js"></script>
    <script defer src="vendor/uPlot.iife.min.js"></script>
    <script type="module" src="app.js?v=9"></script>
    <script type="module" src="../stars.js?v=2" fetchpriority="low"></script>
</head>
<body class="targetplotter-page targetplotter-js">
    <canvas id="warp-canvas" aria-hidden="true"></canvas>
    <main class="plotter-workspace">
        <header class="workspace-header">
            <a href="../index.html" class="home-link" aria-label="Back to home">
                <img src="../icons/arrow_back_30dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg" alt="">
            </a>
            <h1>Target Plotter</h1>
        </header>

        <div class="workspace-grid">
            <div id="chart" class="plot-column">
                <div class="chart-paper">
                    <p id="status" role="status"></p>
                    <div id="plot-surface"></div>
                    <div class="chart-tools">
                        <button type="button" id="save_button" aria-label="Save plot as PNG" title="Save plot as PNG" disabled>
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>
                            </svg>
                        </button>
                        <label class="axis-mode"><input type="checkbox" id="lst_axis"> LST</label>
                    </div>
                </div>
                <div class="chart-options">
                    <label><input type="checkbox" id="show_current_time"> Show current time</label>
                    <label><input type="checkbox" id="show_dates"> Show dates</label>
                    <label><input type="checkbox" id="use_12_hour"> 12-hour clock</label>
                    <label class="timezone-mode">Timezone
                        <select id="timezone_mode">
                            <option value="local">Local time</option>
                            <option value="UTC">UTC</option>
                            <option value="HST">HST (UTC−10)</option>
                            <option value="AKST">AKST (UTC−9)</option>
                            <option value="AKDT">AKDT (UTC−8)</option>
                            <option value="PST">PST (UTC−8)</option>
                            <option value="PDT">PDT (UTC−7)</option>
                            <option value="MST">MST (UTC−7)</option>
                            <option value="MDT">MDT (UTC−6)</option>
                            <option value="CST">CST (UTC−6)</option>
                            <option value="CDT">CDT (UTC−5)</option>
                            <option value="EST">EST (UTC−5)</option>
                            <option value="EDT">EDT (UTC−4)</option>
                        </select>
                    </label>
                </div>
                <p id="now_status" role="status"></p>
                <div id="plot-details"></div>
            </div>
            <aside class="input-container" aria-label="Target and observing settings">
                <div class="plot-field">
                    <label for="target_name_input">Target Name</label>
                    <input type="text" id="target_name_input" value="HR 8799">
                </div>
                <div class="field-pair">
                    <div class="plot-field">
                        <label for="ra_input">RA (HMS)</label>
                        <input type="text" id="ra_input" value="23 07 28.7">
                    </div>
                    <div class="plot-field">
                        <label for="dec_input">Dec (DMS)</label>
                        <input type="text" id="dec_input" value="+21 08 03.0">
                    </div>
                </div>
                <div class="plot-field target-history">
                    <span id="target_history_label">Recent Targets</span>
                    <ul id="target_history" aria-labelledby="target_history_label"></ul>
                </div>

                <div class="observing-fields">
                    <div class="plot-field">
                        <label id="date_label" for="date_input">Date (UTC) <span id="date_today" hidden>(Today)</span></label>
                        <input type="date" id="date_input" required>
                    </div>
                    <div class="field-pair">
                        <div class="plot-field">
                            <label for="lat_input">Latitude</label>
                            <input type="text" id="lat_input" value="19.8286">
                        </div>
                        <div class="plot-field">
                            <label for="lon_input">Longitude</label>
                            <input type="text" id="lon_input" value="-155.4742">
                        </div>
                    </div>
                    <p class="site-note">Visibility uses the Keck II telescope limits at Keck and the horizon at other sites.</p>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
